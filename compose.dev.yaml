name: isterlab-dev
services:
  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: ${STACK_ENV_FILE:-.env.dev}
    environment:
      DJANGO_DEBUG: "True"
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /app/db.sqlite3
      MEDIA_ROOT: /app/media
      COLLECT_STATIC: "0"
    command: [python, manage.py, runserver, "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8020}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
