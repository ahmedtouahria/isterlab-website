<!doctype html>
<html lang="en">
{% load static %}
<head>
    <!-- ✅ Required Meta Tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">

    <!-- ✅ SEO Meta Tags -->
    <meta name="description" content="Isterlab is a leading software agency providing innovative IT solutions, web development, and digital marketing services.">
    <meta name="keywords" content="Software Agency, Web Development, IT Solutions, Digital Marketing">
    <meta name="author" content="Isterlab">
    
    <!-- ✅ Open Graph for Social Media -->
    <meta property="og:title" content="Isterlab - Software Agency & IT Solutions">
    <meta property="og:description" content="Your one-stop solution for IT services, including Infrastructure Projects, IT Staffing Solution, and data Centre Infrastructure Management.">
    <meta property="og:image" content="{% static 'assets/img/og-image.png' %}">
    <meta property="og:url" content="https://www.isterlab.com">
    <meta property="og:type" content="website">
    
    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Isterlab - Software Agency & IT Solutions">
    <meta name="twitter:description" content="Leading software development & digital marketing solutions.">
    <meta name="twitter:image" content="{% static 'assets/img/og-image.png' %}">

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://www.isterlab.com">

    <!-- ✅ Favicons -->
    <link rel="icon" href="{% static 'assets/img/icon.ico' %}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{% static 'assets/img/icon.ico' %}">

    <!-- ✅ Prefetching & Performance Optimizations -->
    <link rel="preload" as="style" href="{% static 'assets/css/style2.min.css' %}">
    <link rel="preload" as="image" href="{% static 'assets/img/sm-logo.svg' %}">
    <link rel="dns-prefetch" href="//ajax.googleapis.com">
    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
    
    <!-- ✅ Bootstrap & Styles -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/animate.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/jquery.fancybox.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/boxicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/preloader.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style2.min.css' %}">

    <!-- ✅ Async Loading for jQuery -->
    <script async src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <title>Isterlab - Software Agency & Creative IT Solutions</title>
</head>

<body class="home-dark  tt-magic-cursor">


    {% include "partes/navbar.html" %}

    {% block content %}
    
    {% endblock content %}

    {% include "partes/footer.html" %}


<!-- ✅ Load Critical Scripts First -->
<script defer src="{% static 'assets/js/popper.min.js' %}"></script>
<script defer src="{% static 'assets/js/bootstrap.min.js' %}"></script>

<!-- ✅ Performance Optimizations -->
<script defer src="{% static 'assets/js/swiper-bundle.min.js' %}"></script>
<script defer src="{% static 'assets/js/waypoints.min.js' %}"></script>
<script defer src="{% static 'assets/js/jquery.counterup.min.js' %}"></script>
<script defer src="{% static 'assets/js/isotope.pkgd.min.js' %}"></script>
<script defer src="{% static 'assets/js/jquery.fancybox.min.js' %}"></script>

<!-- ✅ Lazy Load Heavy Animations (Only Load When Needed) -->
<script defer src="{% static 'assets/js/gsap.min.js' %}"></script>
<script defer src="{% static 'assets/js/simpleParallax.min.js' %}"></script>
<script defer src="{% static 'assets/js/TweenMax.min.js' %}"></script>

<!-- ✅ Load Marquee & Wow JS Only When DOM is Ready -->
<script defer src="{% static 'assets/js/jquery.marquee.min.js' %}"></script>
<script defer src="{% static 'assets/js/wow.min.js' %}"></script>

<!-- ✅ Custom & Preloader Scripts -->
<script defer src="{% static 'assets/js/preloader.js' %}"></script>
<script defer src="{% static 'assets/js/custom.js' %}"></script>

<!-- ✅ Run Marquee Initialization Only When Document is Ready -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (document.querySelector(".marquee_text")) {
            $(".marquee_text").marquee({
                direction: "left",
                duration: 40000,
                gap: 50,
                delayBeforeStart: 0,
                duplicated: true,
                startVisible: true,
            });
        }

        if (document.querySelector(".marquee_text3")) {
            $(".marquee_text3").marquee({
                direction: "left",
                duration: 25000,
                gap: 50,
                delayBeforeStart: 0,
                duplicated: true,
                startVisible: true,
            });
        }
    });
</script>


</body>

</html>
