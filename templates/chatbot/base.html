<!DOCTYPE html>
<html lang="en" data-bs-theme="">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon.ico">
    <!-- Page Title -->
    <title>ChatBot | ConnectMe | Chat Application HTML Template</title>
    <!-- Page Stylesheets -->
    <link rel="stylesheet" href="{% static 'chatbot/assets/css/bundle.css.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/assets/css/app.css.css' %}">
</head>

<body class="tyn-body">
    <div class="tyn-root">
        <div class="tyn-quick-chat active" id="tynQuickChat">
            
            {% block content %}
            
            {% endblock content %}
        </div><!-- .tyn-quick-chat -->
    </div><!-- .tyn-root -->
    <!-- Page Scripts -->
    <script src="{% static 'chatbot/assets/js/bundle.js' %}"></script>
    {% block js %}{% endblock js %}
</body>

</html>
