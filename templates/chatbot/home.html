{% extends "chatbot/base.html" %}
{% load static %}
{% block content %}

<div class="tyn-quick-chat-box " id="tynChatBody">
    <div class="tyn-quick-chat-reply js-scroll-to-end">
        <div class="tyn-reply tyn-reply-quick" id="tynReply">
            <div class="tyn-reply-item incoming">

            </div>
        </div><!-- .tyn-reply -->
    </div><!-- .tyn-quick-chat-reply -->
</div><!-- .tyn-quick-chat-box -->

{% endblock content %}

{% block js %}
<script>
// Global variable to track conversation state
let currentState = 'init';
const chatHistory = [];

// Initialize chat with proper JSON parsing
function initializeChat() {
    try {

        // Load initial state
        loadState('init');
        
        // Setup event listeners
        setupEventListeners();
        
    } catch (error) {
        console.error('Chat initialization failed:', error);
        showErrorMessage();
    }
}

function setupEventListeners() {
    // Handle button clicks
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('option-btn')) {
            const optionType = e.target.dataset.optionType;
            const optionTarget = e.target.dataset.optionTarget;
            const optionValue = e.target.dataset.optionValue;
            
            handleOptionClick(optionType, optionTarget, optionValue, e.target.textContent);
        }
    });
    
    // Handle back button
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('chat-back-btn')) {
            navigateBack();
        }
    });
}

function handleOptionClick(type, target, value, displayText) {
    // Add user message to chat
    appendMessage(displayText, true);
    
    // Update chat history
    chatHistory.push(currentState);
    
    // Show typing indicator
    showTypingIndicator();
    
    // Process after short delay for better UX
    setTimeout(() => {
        removeTypingIndicator();
        
        switch (type) {
            case 'category':
                loadState(target);
                break;
                
            case 'url':
                window.open(value || target, '_blank');
                navigateBack();
                break;
                
            case 'form':
                showForm(target);
                break;
                
            case 'response':
                showResponse(target, value);
                break;
                
            case 'back':
                navigateTo(target || 'init');
                break;
                
            default:
                console.warn('Unknown option type:', type);
                loadState('init');
        }
        
        scrollToBottom();
    }, 800);
}

function loadState(stateKey) {
    const state = window.conversationFlow[stateKey];
    if (!state) {
        console.error('State not found:', stateKey);
        loadState('init');
        return;
    }
    
    currentState = stateKey;
    appendBotResponse(state.message, state.options);
}

function showResponse(responseId, responseText) {
    const responseHtml = `
        <div class="tyn-reply-item incoming">
            <div class="tyn-reply-avatar">
                <div class="tyn-media tyn-size-md tyn-circle">
                    <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                </div>
            </div>
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${responseText || 'Response not available'}</div>
                    <button class="btn btn-sm btn-outline-secondary chat-back-btn mt-2">
                        ← Back
                    </button>
                </div>
            </div>
        </div>
    `;
    
    document.querySelector('#tynReply').insertAdjacentHTML('beforeend', responseHtml);
}

function navigateTo(stateKey) {
    currentState = stateKey;
    loadState(stateKey);
}

function navigateBack() {
    if (chatHistory.length > 0) {
        const previousState = chatHistory.pop();
        navigateTo(previousState);
    } else {
        navigateTo('init');
    }
}

function appendMessage(message, isUser) {
    const messageClass = isUser ? 'outgoing' : 'incoming';
    const avatarHtml = isUser ? '' : `
        <div class="tyn-reply-avatar">
            <div class="tyn-media tyn-size-md tyn-circle">
                <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
            </div>
        </div>
    `;
    
    const messageHtml = `
        <div class="tyn-reply-item ${messageClass}">
            ${avatarHtml}
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${message}</div>
                </div>
            </div>
        </div>
    `;
    
    document.querySelector('#tynReply').insertAdjacentHTML('beforeend', messageHtml);
}

function appendBotResponse(message, options) {
    let buttonsHtml = '';
    
    for (const [key, option] of Object.entries(options)) {
        const btnClass = option.type === 'back' ? 
            'btn-outline-secondary' : 'btn-outline-primary';
        
        buttonsHtml += `
            <button class="btn btn-sm ${btnClass} btn-pill option-btn"
                    data-option-type="${option.type}"
                    data-option-target="${key}"
                    data-option-value="${option.url || option.target || ''}">
                ${option.text}
            </button>
        `;
    }
    
    const responseHtml = `
        <div class="tyn-reply-item incoming">
            <div class="tyn-reply-avatar">
                <div class="tyn-media tyn-size-md tyn-circle">
                    <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                </div>
            </div>
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${message}</div>
                    <div class="tyn-button-group mt-2">${buttonsHtml}</div>
                </div>
            </div>
        </div>
    `;
    
    document.querySelector('#tynReply').insertAdjacentHTML('beforeend', responseHtml);
}
// Keep your existing helper functions:

document.addEventListener("DOMContentLoaded", function() {
    // Get conversation flow from Django template context
    const conversationFlow = {{ conversation_flow_json|safe }}
    
    // Initialize chat with the preloaded flow
    window.conversationFlow = conversationFlow;
    initializeChat();
    
    // Error handling for template context
    if (!conversationFlow || Object.keys(conversationFlow).length === 0) {
        console.error('Conversation flow not properly initialized');
        appendMessage("We're having technical difficulties. Please refresh the page.", false);
    }
});

    function showTypingIndicator() {
        const chatReply = document.querySelector('#tynReply');
        const typingHtml = `
            <div class="tyn-reply-item incoming typing-indicator">
                <div class="tyn-reply-avatar">
                    <div class="tyn-media tyn-size-md tyn-circle">
                        <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                    </div>
                </div>
                <div class="tyn-reply-group">
                    <div class="tyn-reply-bubble">
                        <div class="tyn-reply-text">Typing...</div>
                    </div>
                </div>
            </div>
        `;
        chatReply.insertAdjacentHTML('beforeend', typingHtml);
    }

    function removeTypingIndicator() {
        const typingIndicator = document.querySelector('.typing-indicator');
        if (typingIndicator) {
            typingIndicator.remove();
        }
    }

    function scrollToBottom() {
        window.scrollTo(0, document.body.scrollHeight);
    }
    function showErrorMessage() {
        appendMessage("We're having trouble loading the chat. Please try again later.", false);
    }
</script>

<style>
    .tyn-button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
    }
    
    .tyn-reply-bubble {
        max-width: 80%;
    }
    
    .option-btn {
        transition: all 0.2s ease;
    }
    
    .option-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
</style>
{% endblock js %}
