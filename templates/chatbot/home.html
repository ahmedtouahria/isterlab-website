{% extends "chatbot/base.html" %}
{% load static %}
{% block content %}

<div class="tyn-quick-chat-box " id="tynChatBody">
    <div class="tyn-quick-chat-reply js-scroll-to-end">
        <div class="tyn-reply tyn-reply-quick" id="tynReply">
            <div class="tyn-reply-item incoming">

            </div>
        </div><!-- .tyn-reply -->
    </div><!-- .tyn-quick-chat-reply -->
</div><!-- .tyn-quick-chat-box -->

{% endblock content %}

{% block js %}
<script>
// Global variable to track conversation state
let currentCategoryId = null;
let conversationHistory = [];

function initializeChat() {
    // Load initial menu
    loadConversationFlow('init');
    
    // Handle button clicks
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('option-btn')) {
            const optionType = e.target.getAttribute('data-option-type');
            const optionId = e.target.getAttribute('data-option-id');
            const optionValue = e.target.getAttribute('data-option-value');
            
            handleOptionSelection(optionType, optionId, optionValue, e.target.textContent);
        }
    });
}

function handleOptionSelection(type, id, value, text) {
    const chatReply = document.querySelector('#tynReply');
    
    // Add user's selection to chat
    appendMessage(text, true);
    
    // Track navigation history
    if (type === 'category') {
        conversationHistory.push({
            type: 'category',
            id: id,
            parentId: currentCategoryId
        });
        currentCategoryId = id;
    } else if (type === 'back') {
        if (value) {
            currentCategoryId = value;
        } else {
            currentCategoryId = null; // Return to main menu
        }
    }
    
    // Show typing indicator
    showTypingIndicator();
    
    // Simulate API call delay
    setTimeout(() => {
        removeTypingIndicator();
        
        if (type === 'back') {
            // Handle back navigation
            if (value) {
                loadConversationFlow(`category_${value}`);
            } else {
                loadConversationFlow('init');
            }
        } else if (type === 'response') {
            // Handle response display
            displayResponse(id);
        } else {
            // Load the selected category
            loadConversationFlow(`category_${id}`);
        }
        
        scrollToBottom();
    }, 800);
}

function loadConversationFlow(flowKey) {
    // In a real implementation, this would fetch from your Django endpoint
    // For now we'll assume conversationFlow is loaded from the backend
    const flow = conversationFlow[flowKey];
    
    if (!flow) {
        console.error('Flow not found:', flowKey);
        return;
    }
    
    appendBotResponse(flow.message, flow.options);
}

function displayResponse(responseId) {
    // In a real implementation, fetch the full response from your Django endpoint
    const response = {
        id: responseId,
        text: "This would be the detailed response from your database",
        blogs: [] // Would be populated from Response.blogs in your Django model
    };
    
    const chatReply = document.querySelector('#tynReply');
    
    const responseHtml = `
        <div class="tyn-reply-item incoming">
            <div class="tyn-reply-avatar">
                <div class="tyn-media tyn-size-md tyn-circle">
                    <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                </div>
            </div>
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${response.text}</div>
                    ${response.blogs && response.blogs.length > 0 ? 
                        `<div class="mt-3">
                            <h6>Related Resources:</h6>
                            <ul class="list-unstyled">
                                ${response.blogs.map(blog => 
                                    `<li><a href="${blog.url}" target="_blank">${blog.title}</a></li>`
                                ).join('')}
                            </ul>
                        </div>` 
                        : ''}
                    <div class="tyn-button-group mt-2">
                        <button class="btn btn-sm btn-outline-primary btn-pill option-btn" 
                                data-option-type="back" 
                                data-option-id="${responseId}"
                                data-option-value="${currentCategoryId}">
                            ← Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    chatReply.insertAdjacentHTML('beforeend', responseHtml);
}

function appendMessage(message, isUser) {
    const chatReply = document.querySelector('#tynReply');
    const messageClass = isUser ? 'outgoing' : 'incoming';
    
    const messageHtml = `
        <div class="tyn-reply-item ${messageClass}">
            ${!isUser ? `
            <div class="tyn-reply-avatar">
                <div class="tyn-media tyn-size-md tyn-circle">
                    <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                </div>
            </div>` : ''}
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${message}</div>
                </div>
            </div>
        </div>
    `;
    
    chatReply.insertAdjacentHTML('beforeend', messageHtml);
}

function appendBotResponse(message, options) {
    const chatReply = document.querySelector('#tynReply');
    
    let buttonsHtml = '';
    for (const [value, option] of Object.entries(options)) {
        if (value === 'back') {
            buttonsHtml += `
                <button class="btn btn-sm btn-outline-secondary btn-pill option-btn" 
                        data-option-type="back" 
                        data-option-id="${option.target || ''}"
                        data-option-value="${option.target || ''}">
                    ${option.text}
                </button>
            `;
        } else {
            buttonsHtml += `
                <button class="btn btn-sm btn-outline-primary btn-pill option-btn" 
                        data-option-type="${option.type || 'category'}" 
                        data-option-id="${option.id || value.split('_')[1]}"
                        data-option-value="${value}">
                    ${option.text || option}
                </button>
            `;
        }
    }
    
    const responseHtml = `
        <div class="tyn-reply-item incoming">
            <div class="tyn-reply-avatar">
                <div class="tyn-media tyn-size-md tyn-circle">
                    <img src="/static/chatbot/assets/images/avatar/bot-1.jpg" alt="">
                </div>
            </div>
            <div class="tyn-reply-group">
                <div class="tyn-reply-bubble">
                    <div class="tyn-reply-text">${message}</div>
                    <div class="tyn-button-group mt-2">${buttonsHtml}</div>
                </div>
            </div>
        </div>
    `;
    
    chatReply.insertAdjacentHTML('beforeend', responseHtml);
}

    function showTypingIndicator() {
        const chatReply = document.querySelector('#tynReply');

    function removeTypingIndicator() {
