 {% load static %}
 <!--=========== fun fact Wrapper Start ==========-->
    <div class="fun-fact-wrapper bg-gray section-space--pb_30 section-space--pt_60 mt_80">
        <div class="container">
            <div class="row">
                <div class="col-md-4 col-sm-6">
                    <div class="fun-fact--four text-center">
                        <div class="icon">
                            <i class="far fa-smile-beam"></i>
                        </div>
                        <div class="fun-fact-text">
                            <div class="fun-fact__count counter">{{config.NUMBER_OF_CLIENTS}}</div>
                            <h6 class="fun-fact__text">Happy clients</h6>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="fun-fact--four text-center">
                        <div class="icon">
                            <i class="far fa-folder"></i>
                        </div>
                        <div class="fun-fact-text">
                            <div class="fun-fact__count counter">{{config.NUMBER_OF_PROJECTS}}</div>
                            <h6 class="fun-fact__text">Finished projects</h6>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="fun-fact--four text-center">
                        <div class="icon">
                            <i class="far fa-user"></i>
                        </div>
                        <div class="fun-fact-text">
                            <div class="fun-fact__count counter">{{config.NUMBER_OF_YEARS}}</div>
                            <h6 class="fun-fact__text">Experienced year</h6>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!--=========== fun fact Wrapper End ==========-->
