<div class="feature-images-wrapper section-space--ptb_100">
    <div class="container">

        <div class="row">
            <div class="col-lg-12">
                <!-- section-title-wrap Start -->
                <div class="section-title-wrap text-center">
                    <h3 class="heading">Preparing for your success, <br> we provide truly prominent IT services</h3>
                </div>
                <!-- section-title-wrap Start -->
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="feature-images__one">
                    <div class="row">
                        {% for service in services %}
                        <div class="col-lg-4 col-md-6 wow move-up">
                            <!-- ht-box-icon Start -->
                            <div class="ht-box-images style-01">
                                <div class="image-box-wrap">
                                    <a href = "{% url "service_details" service.name %}" class="box-image">
                                        <img loading="lazy"class="img-fulid" src="{{service.icon.url}}" alt="">
                                    </a>
                                    <div class="content">
                                        <h5 class="heading">{{service.name}}</h5>
                                        <div class="text">{{service.short_description | slice:150}}...</div>
                                        <div class="circle-arrow">
                                            <div class="middle-dot"></div>
                                            <div class="middle-dot dot-2"></div>
                                            <a href="{% url "service_details" service.name %}">
                                                <i class="fas fa-arrow-right"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- ht-box-icon End -->
                        </div>
                        {% endfor %}
                   
                    </div>
                </div>

                <div class="section-under-heading text-center section-space--mt_80">Challenges are just opportunities in disguise. <a href="it-services.html#">Take the challenge!</a></div>

            </div>
        </div>
    </div>
</div>
