{% load static %}
<div class="image-l-r-box">
    <div class="row">
        <div class="col image-box-area">
            <div class="row image-box-boder-box">
                {% for solution in solutions %}
                <div class="col-lg-4 col-md-6 image-box-boder">
                    <!-- ht-box-icon Start -->
                    <div class="ht-box-images style-09">
                        <div class="image-box-wrap">
                            <a href = "{% url "solution_details" solution.name %}" class="box-image">
                                <img loading="lazy"src=" {% if solution.icon %}{{solution.icon.url}}{% endif %} " class="img-fluid" alt="">
                            </a>
                            <div class="content">
                                <h6 class="heading">{{solution.name}}</h6>
                                <div class="text">{{solution.short_description}}</div>
                                <div class="more-arrow-link">
                                    <a href="{% url "solution_details" solution.name %}">
                                        Learn more <i class="fas fa-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ht-box-icon End -->
                </div>
                {% endfor %}
             
       
            </div>
        </div>
    </div>
</div>
